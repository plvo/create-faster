name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: "🧪 Test & Quality"
    runs-on: ubuntu-latest
    outputs:
      build-success: ${{ steps.build.outcome == 'success' }}

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v7

      - name: "🚫 Conflict Markers"
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)( |$)' -- . ':(exclude)bun.lock' ':(exclude)bun.lockb' ':(exclude)package-lock.json' ':(exclude)pnpm-lock.yaml'; then
            echo "::error::Committed merge conflict markers, see the lines above"
            exit 1
          fi

      - name: "🔧 Setup Bun Runtime"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: "🔧 Setup pnpm"
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: "📦 Install Dependencies"
        run: bun install

      - name: "🔍 Lint & Format"
        run: bun run check

      - name: "🧹 Unused Code"
        run: bun run check:unused

      - name: "🔎 Typecheck"
        run: bun run typecheck

      - name: "🏗️ Build Check"
        id: build
        run: bun run build:cli

      - name: "🧪 Unit Tests"
        working-directory: apps/cli
        run: bun run test:unit

      - name: "🔗 Integration Tests"
        working-directory: apps/cli
        run: bun run test:integration

      - name: "💾 Cache Build Artifacts"
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            dist/
            node_modules/
          key: build-${{ github.sha }}-${{ hashFiles('**/bun.lock') }}
